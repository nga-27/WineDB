name: Pylint

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13"]
        outputs:
            status: ${{ steps.status_value.outcome }}
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v4
              with:
                python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install .[dev,app]
            
            - name: pylint
              run: |
                pylint $(git ls-files '*.py')
                pylint $(git ls-files 'app/*.py')
                pylint $(git ls-files 'app/cmd_app/*.py')
                pylint $(git ls-files 'app/cmd_app/api_utils/*.py')
                # pylint $(git ls-files 'app/db/*.py')
                # pylint $(git ls-files 'app/routers/*.py')
                # pylint $(git ls-files 'app/spreadsheet/*.py')
                # pylint $(git ls-files 'app/spreadsheet/tabs/*.py')

            - name: set-output
              id: status_value
              run: |
                echo "status=success" >> $GITHUB_OUTPUT
